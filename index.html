<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#472d22">
  <meta name="description" content="Jeu de piste familial sur les traces de Jeanne d’Arc à Orléans.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>La chronique perdue de Jeanne d’Arc</title>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>
  <header class="topbar">
    <button id="homeBtn" class="icon-btn" aria-label="Retour à l’accueil">⌂</button>
    <div>
      <strong>La chronique perdue</strong>
      <small id="subtitle">Jeu de piste à Orléans</small>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Ouvrir les réglages">⚙</button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <nav id="bottomNav" class="bottom-nav" aria-label="Navigation principale" hidden>
    <button data-nav="map">🗺️<span>Parcours</span></button>
    <button data-nav="chest">📜<span>Chronique</span></button>
    <button data-nav="help">❓<span>Aide</span></button>
  </nav>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <h2>Réglages</h2>
      <label class="switch-row"><span>Mode mission courte</span><input id="fatigueToggle" type="checkbox"></label>
      <label class="switch-row"><span>Lecture vocale</span><input id="speechToggle" type="checkbox"></label>
      <label>Contraste
        <select id="contrastSelect">
          <option value="normal">Normal</option>
          <option value="high">Renforcé</option>
        </select>
      </label>
      <button id="adultModeBtn" type="button" class="secondary">Mode adulte</button>
      <button value="close" class="primary">Fermer</button>
    </form>
  </dialog>

  <dialog id="adultDialog">
    <form method="dialog" class="dialog-card">
      <h2>Mode adulte</h2>
      <p class="muted">Ces commandes permettent de débloquer le parcours en cas d’imprévu.</p>
      <label>Étape active
        <select id="adultMissionSelect"></select>
      </label>
      <button id="adultUnlockBtn" type="button" class="secondary">Valider cette étape</button>
      <button id="adultResetBtn" type="button" class="danger">Réinitialiser l’aventure</button>
      <button value="close" class="primary">Fermer</button>
    </form>
  </dialog>

  <template id="toastTemplate"><div class="toast" role="status"></div></template>
  <script src="app.js" defer></script>
</body>
</html>
