<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17365d">
  <meta name="description" content="Jeu d’enquête patrimoniale familial sur Jeanne d’Arc et Orléans.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Huit preuves">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>La Chronique des huit preuves — V3.1</title>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>

  <header class="topbar">
    <button id="homeBtn" class="round-btn" type="button" aria-label="Retour à l’accueil">⌂</button>
    <div class="topbar-title">
      <strong>La Chronique des huit preuves</strong>
      <small id="subtitle">Enquête Jeanne d’Arc à Orléans</small>
    </div>
    <button id="settingsBtn" class="round-btn" type="button" aria-label="Ouvrir les réglages">⚙</button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <nav id="bottomNav" class="bottom-nav" aria-label="Navigation principale" hidden>
    <button type="button" data-nav="map"><span aria-hidden="true">🗺️</span><small>Parcours</small></button>
    <button type="button" data-nav="evidence"><span aria-hidden="true">🔎</span><small>Preuves</small></button>
    <button type="button" data-nav="inventory"><span aria-hidden="true">🛡️</span><small>Collection</small></button>
    <button type="button" data-nav="help"><span aria-hidden="true">?</span><small>Aide</small></button>
  </nav>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><h2>Réglages</h2><button class="round-btn" value="close" aria-label="Fermer">×</button></div>
      <label class="switch-row"><span><strong>Mode mission courte</strong><small>Une épreuve essentielle par lieu</small></span><input id="fatigueToggle" type="checkbox"></label>
      <label class="switch-row"><span><strong>Lecture vocale</strong><small>Lecture à la demande des narrations</small></span><input id="speechToggle" type="checkbox"></label>
      <label class="switch-row"><span><strong>Animations réduites</strong><small>Limite les mouvements décoratifs</small></span><input id="motionToggle" type="checkbox"></label>
      <label>Contraste
        <select id="contrastSelect">
          <option value="normal">Normal</option>
          <option value="high">Renforcé</option>
        </select>
      </label>
      <button id="installBtn" type="button" class="secondary" hidden>Installer l’application</button>
      <button id="adultModeBtn" type="button" class="secondary">Ouvrir le mode adulte</button>
      <button value="close" class="primary">Terminer</button>
    </form>
  </dialog>

  <dialog id="adultDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><h2>Mode adulte</h2><button class="round-btn" value="close" aria-label="Fermer">×</button></div>
      <p class="muted">Utilisez ces commandes uniquement en cas de fermeture, de fatigue ou de difficulté technique.</p>
      <label>Mission à ouvrir
        <select id="adultMissionSelect"></select>
      </label>
      <button id="adultOpenBtn" type="button" class="secondary">Ouvrir cette mission</button>
      <button id="adultCompleteBtn" type="button" class="secondary">Valider cette mission</button>
      <button id="adultFinalBtn" type="button" class="secondary">Débloquer le Tribunal final</button>
      <button id="adultResetBtn" type="button" class="danger">Réinitialiser toute l’aventure</button>
      <button value="close" class="primary">Fermer</button>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-card">
      <h2 id="confirmTitle">Confirmation</h2>
      <p id="confirmText"></p>
      <div class="button-row">
        <button value="cancel" class="secondary">Annuler</button>
        <button id="confirmAction" value="confirm" class="danger">Confirmer</button>
      </div>
    </form>
  </dialog>

  <template id="toastTemplate"><div class="toast" role="status"></div></template>
  <script src="app.js" defer></script>
</body>
</html>
