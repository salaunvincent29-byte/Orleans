<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172a55">
  <meta name="description" content="Jeu d’aventure historique familial sur les traces de Jeanne d’Arc à Orléans.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>La chronique perdue de Jeanne d’Arc — V2</title>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>

  <header class="topbar">
    <button id="homeBtn" class="icon-btn" aria-label="Retour à l’accueil">⌂</button>
    <div class="brand">
      <strong>La chronique perdue</strong>
      <small id="subtitle">Aventure johannique · V2</small>
    </div>
    <div class="hud" id="hud" hidden aria-label="Progression">
      <span title="Courage" id="courageHud">❤️❤️❤️</span>
      <span title="Sceaux gagnés" id="sealHud">🛡️ 0</span>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Ouvrir les réglages">⚙</button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <nav id="bottomNav" class="bottom-nav" aria-label="Navigation principale" hidden>
    <button data-nav="map" aria-label="Parcours"><span aria-hidden="true">🗺️</span><span>Parcours</span></button>
    <button data-nav="inventory" aria-label="Inventaire"><span aria-hidden="true">🎒</span><span>Inventaire</span></button>
    <button data-nav="chronicle" aria-label="Chronique"><span aria-hidden="true">📜</span><span>Chronique</span></button>
    <button data-nav="help" aria-label="Aide"><span aria-hidden="true">❓</span><span>Aide</span></button>
  </nav>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-heading">
        <h2>Réglages</h2>
        <button value="close" class="close-btn" aria-label="Fermer">×</button>
      </div>
      <label class="switch-row"><span>Mode mission courte</span><input id="fatigueToggle" type="checkbox"></label>
      <label class="switch-row"><span>Sons et voix</span><input id="soundToggle" type="checkbox"></label>
      <label class="switch-row"><span>Réduire les animations</span><input id="motionToggle" type="checkbox"></label>
      <label>Contraste
        <select id="contrastSelect">
          <option value="normal">Normal</option>
          <option value="high">Renforcé</option>
        </select>
      </label>
      <button id="installBtn" type="button" class="secondary" hidden>Installer l’application</button>
      <button id="adultModeBtn" type="button" class="secondary">Mode adulte</button>
      <button value="close" class="primary">Fermer</button>
    </form>
  </dialog>

  <dialog id="adultDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-heading">
        <h2>Mode adulte</h2>
        <button value="close" class="close-btn" aria-label="Fermer">×</button>
      </div>
      <p class="muted">Ces commandes servent uniquement en cas de fermeture, de fatigue ou de blocage technique.</p>
      <label>Étape à ouvrir
        <select id="adultMissionSelect"></select>
      </label>
      <button id="adultUnlockBtn" type="button" class="secondary">Valider cette étape</button>
      <button id="adultCourageBtn" type="button" class="secondary">Rendre tout le courage</button>
      <button id="adultResetBtn" type="button" class="danger">Réinitialiser l’aventure</button>
      <button value="close" class="primary">Fermer</button>
    </form>
  </dialog>

  <div id="toastRegion" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
  <script src="app.js" defer></script>
</body>
</html>
