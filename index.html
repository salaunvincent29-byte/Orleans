<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17365d">
  <meta name="description" content="Jeu de piste familial et ludique sur Jeanne d’Arc à Orléans.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bannière de Jeanne">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>La Bannière disparue — V4</title>
</head>
<body>
  <a class="skip" href="#app">Aller au jeu</a>
  <header class="topbar">
    <button id="homeBtn" class="icon-btn" aria-label="Accueil">⌂</button>
    <div><strong>La Bannière disparue</strong><small id="subtitle">Aventure Jeanne d’Arc à Orléans</small></div>
    <button id="settingsBtn" class="icon-btn" aria-label="Réglages">⚙</button>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <nav id="nav" class="nav" hidden>
    <button data-nav="map">🗺️<small>Parcours</small></button>
    <button data-nav="banner">🏳️<small>Bannière</small></button>
    <button data-nav="help">❓<small>Aide</small></button>
  </nav>
  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><h2>Réglages</h2><button value="close" class="icon-btn" aria-label="Fermer">×</button></div>
      <label class="row"><span><strong>Mode express</strong><small>Une seule épreuve par lieu</small></span><input id="expressToggle" type="checkbox"></label>
      <label class="row"><span><strong>Lecture vocale</strong><small>Lit les histoires à la demande</small></span><input id="speechToggle" type="checkbox"></label>
      <label>Contraste<select id="contrastSelect"><option value="normal">Normal</option><option value="high">Renforcé</option></select></label>
      <button id="installBtn" class="secondary" type="button" hidden>Installer l’application</button>
      <button id="adultBtn" class="secondary" type="button">Mode adulte</button>
      <button class="primary" value="close">Terminer</button>
    </form>
  </dialog>
  <dialog id="adultDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><h2>Mode adulte</h2><button value="close" class="icon-btn">×</button></div>
      <label>Étape<select id="adultMission"></select></label>
      <button id="adultOpen" type="button" class="secondary">Ouvrir cette étape</button>
      <button id="adultComplete" type="button" class="secondary">Valider cette étape</button>
      <button id="adultReset" type="button" class="danger">Recommencer toute l’aventure</button>
      <button value="close" class="primary">Fermer</button>
    </form>
  </dialog>
  <script src="app.js" defer></script>
</body>
</html>
